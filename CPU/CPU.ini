[Metadata]
Author=Ragingwasabi
Information=A skin that displays info about your CPU

[Rainmeter]
Update=500
@include=#@#BVsettings.inc
OnRefreshAction=[!HideMeterGroup "hidden"][!Redraw]

[Variables]
@include=#@#BVstylesheet.inc

; Word substituted for blank process names
placeholder="-"

; Extra panel column positions
extraposproc=855

; Peak tracking — do not change
USAGE=0


; =============================================================
;  MEASURES
; =============================================================

[MeasureUptime]
Measure=Uptime
Format="%4!02i!:%3!02i!:%2!02i!:%1!02i!"
UpdateDivider=1

[MeasureCPUMHZ]
Measure=Registry
RegHKey=HKEY_LOCAL_MACHINE
RegKey=HARDWARE\DESCRIPTION\System\CentralProcessor\0
RegValue=~MHz
UpdateDivider=2

[MeasureCPU]
Measure=CPU
Processor=0
UpdateDivider=2

[avgMeasureCPU]
Measure=Calc
Formula=MeasureCPU
AverageSize=20
UpdateDivider=2

[peakMeasureCPU]
Measure=Calc
Formula=Round(MeasureCPU,4)
IfConditionMode=1
IfCondition=peakMeasureCPU > #USAGE#
IfTrueAction=[!SetVariable USAGE [peakMeasureCPU]]
DynamicVariables=1
UpdateDivider=2

[peakCPU]
Measure=Calc
Formula=#USAGE#
DynamicVariables=1
UpdateDivider=2


; =============================================================
;  EXTRA MEASURES  (hidden panel)
; =============================================================

[MeasureProc]
Measure=Registry
RegHKey=HKEY_LOCAL_MACHINE
RegKey=HARDWARE\DESCRIPTION\System\CentralProcessor\0
RegValue=ProcessorNameString
Substitute="   ":" "
Group=hidden
UpdateDivider=-1

[MeasureCores]
Measure=Registry
RegHKey=HKEY_LOCAL_MACHINE
RegKey=SYSTEM\CurrentControlSet\Control\Session Manager\Environment
RegValue=NUMBER_OF_PROCESSORS
Group=hidden
UpdateDivider=-1

[NumberofProcessesMeasure]
Measure=Plugin
Plugin=PerfMon
PerfMonObject=System
PerfMonCounter=Processes
PerfMonDifference=0
Group=hidden
UpdateDivider=2

[measureCPUMax]
Measure=Plugin
Plugin=AdvancedCPU
Group=hidden
UpdateDivider=2

; Top processes 1–10: Name+Value pairs
; Each Value reads TopProcess=1 while excluding all higher-ranked processes via CPUExclude.

[MeasureTopProcess1Name]
Measure=Plugin
Plugin=AdvancedCPU
TopProcess=2
CPUExclude=Idle
Substitute="":"#placeholder#"
Group=hidden
UpdateDivider=2

[MeasureTopProcess1Value]
Measure=Plugin
Plugin=AdvancedCPU
TopProcess=1
CPUExclude=Idle
MaxValue=[measureCPUMax]
DynamicVariables=1
Group=hidden
UpdateDivider=2

[MeasureTopProcess2Name]
Measure=Plugin
Plugin=AdvancedCPU
TopProcess=2
CPUExclude=Idle;[MeasureTopProcess1Name]
DynamicVariables=1
Substitute="":"#placeholder#"
Group=hidden
UpdateDivider=2

[MeasureTopProcess2Value]
Measure=Plugin
Plugin=AdvancedCPU
TopProcess=1
CPUExclude=Idle;[MeasureTopProcess1Name]

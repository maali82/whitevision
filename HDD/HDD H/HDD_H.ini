[Metadata]
Author=Ragingwasabi
Information=A skin that displays information about your hard drive

[Rainmeter]
Update=500
@include=#@#BVsettings.inc
OnRefreshAction=[!HideMeterGroup "hidden"][!Redraw]

[Variables]
@include=#@#BVstylesheet.inc

; Set the drive letter to monitor
HDD=H:

; Peak tracking — do not change
ACCESS=0
WRITE=0
READ=0


; =============================================================
;  MEASURES
; =============================================================

[MeasureDiskLabel]
Measure=FreeDiskSpace
Drive="#HDD#"
Label=1
UpdateDivider=4

[DriveAccess]
Measure=Plugin
Plugin=Plugins\PerfMon.dll
PerfMonObject=LogicalDisk
PerfMonCounter="Disk Bytes/sec"
PerfMonInstance="#HDD#"
UpdateDivider=2

[DriveAccessPeak]
Measure=Calc
Formula=DriveAccess
IfConditionMode=1
IfCondition=DriveAccessPeak > #ACCESS#
IfTrueAction=[!SetVariable ACCESS ([DriveAccessPeak])]
DynamicVariables=1
UpdateDivider=2

[finalcalc]
Measure=Calc
Formula=#ACCESS#
DynamicVariables=1
UpdateDivider=2

[DriveAccessAvg]
Measure=Calc
Formula=DriveAccess
AverageSize=30
UpdateDivider=2

[DriveSize]
Measure=FreeDiskSpace
Drive="#HDD#"
Total=1
UpdateDivider=2

[DriveFree]
Measure=FreeDiskSpace
Drive="#HDD#"
UpdateDivider=2

[DriveUsed]
Measure=FreeDiskSpace
Drive="#HDD#"
InvertMeasure=1
UpdateDivider=2


; =============================================================
;  EXTRA MEASURES  (hidden panel)
; =============================================================

[DriveWrite]
Measure=Plugin
Plugin=Plugins\PerfMon.dll
PerfMonObject=LogicalDisk
PerfMonCounter="Disk Write Bytes/sec"
PerfMonInstance="#HDD#"
Group=hidden
UpdateDivider=2

[DriveWritePeak]
Measure=Calc
Formula=DriveWrite
IfConditionMode=1
IfCondition=DriveWritePeak > #WRITE#
IfTrueAction=[!SetVariable WRITE ([DriveWritePeak])]
DynamicVariables=1
Group=hidden
UpdateDivider=2

[finalcalcwrite]
Measure=Calc
Formula=#WRITE#
DynamicVariables=1
Group=hidden
UpdateDivider=2

[DriveWriteAvg]
Measure=Calc
Formula=DriveWrite
AverageSize=30
Group=hidden
UpdateDivider=2

[DriveRead]
Measure=Plugin
Plugin=Plugins\PerfMon.dll
PerfMonObject=LogicalDisk
PerfMonCounter="Disk Read Bytes/sec"
PerfMonInstance="#HDD#"
Group=hidden
UpdateDivider=2

[DriveReadPeak]
Measure=Calc
Formula=DriveRead
IfConditionMode=1
IfCondition=DriveReadPeak > #READ#
IfTrueAction=[!SetVariable READ ([DriveReadPeak])]
DynamicVariables=1
Group=hidden
UpdateDivider=2

[finalcalcread]
Measure=Calc
Formula=#READ#
DynamicVariables=1
Group=hidden
UpdateDivider=2

[DriveReadAvg]
Measure=Calc
Formula=DriveRead
AverageSize=30
Group=hidden
UpdateDivider=2


; =============================================================
;  GRAPH BACKGROUND GRID
; =============================================================

[TOPBORDERLine1]
MeterStyle=DefaultGridLine
X=#initialX#
Y=#initialY#

[Line2]
MeterStyle=DefaultGridLine
X=#initialX#
Y=(#initialY#+1*#horizgapY#)

[Line3]
MeterStyle=DefaultGridLine
X=#initialX#
Y=(#initialY#+2*#horizgapY#)

[Line4]
MeterStyle=DefaultGridLine
X=#initialX#
Y=(#initialY#+3*#horizgapY#)

[Line5]
MeterStyle=DefaultGridLine
X=#initialX#
Y=(#initialY#+4*#horizgapY#)

[Line6]
MeterStyle=DefaultGridLine
X=#initialX#
Y=(#initialY#+5*#horizgapY#)

[Line7]
MeterStyle=DefaultGridLine
X=#initialX#
Y=(#initialY#+6*#horizgapY#)

[Line8]
MeterStyle=DefaultGridLine
X=#initialX#
Y=(#initialY#+7*#horizgapY#)

[Line9]
MeterStyle=DefaultGridLine
X=#initialX#
Y=(#initialY#+8*#horizgapY#)

[Line10]
MeterStyle=DefaultGridLine
X=#initialX#
Y=(#initialY#+9*#horizgapY#)

[Line11]
MeterStyle=DefaultGridLine
X=#initialX#
Y=(#initialY#+10*#horizgapY#)


; =============================================================
;  BACKGROUND  (hover to reveal extra panel)
; =============================================================

[background]
Meter=Image
X=0
Y=0
W=605
H=155
SolidColor=0,0,0,1
MouseOverAction=[!EnableMeasureGroup "hidden"][!UpdateMeasureGroup "hidden"][!UpdateMeterGroup "hidden"][!ShowMeterGroup "hidden"][!Redraw]
MouseLeaveAction=[!DisableMeasureGroup "hidden"][!HideMeterGroup "hidden"][!Redraw]
UpdateDivider=-1


; =============================================================
;  BAR GRAPH
; =============================================================

[unusedbar]
Meter=Image
X=3
Y=130
W=#bargraphwidth#
H=#bargraphheight#
SolidColor=#bargraphempty#
UpdateDivider=-1

[UsedBar]
Meter=Bar
MeasureName=DriveUsed
X=3
Y=130
W=#bargraphwidth#
H=#bargraphheight#
BarColor=#bargraphfill#
BarOrientation=Horizontal


; =============================================================
;  ACCESS GRAPH
; =============================================================

[DriveAccessGraph]
Meter=Histogram
MeasureName=DriveAccess
X=3
Y=20
H=#lingraphheight#
W=#lingraphwidth#
PrimaryColor=#lingraphcolor#
SecondaryColor=#lingraphcolor#
LineCount=1
LineColor=#lingraphcolor#
AutoScale=1
AntiAlias=1


; =============================================================
;  METERS
; =============================================================

[HDDHeader]
Meter=String
MeterStyle=DefaultText
MeasureName=MeasureDiskLabel
X=3
Y=2
Text="DRIVE (#HDD#) %1"
UpdateDivider=1

[DriveAccessPeakStringHeader]
Meter=String
MeterStyle=DefaultText
X=#headerxpos#
Y=37
Text="Peak R+W:"
UpdateDivider=-1

[DriveAccessAvgStringHeader]
Meter=String
MeterStyle=DefaultText
X=#headerxpos#
Y=20r
Text="Avg R+W:"
UpdateDivider=-1

[DriveAccessStringHeader]
Meter=String
MeterStyle=DefaultText
X=#headerxpos#
Y=20r
Text="R+W:"
UpdateDivider=-1

[TotalDriveHeader]
Meter=String
MeterStyle=DefaultText

; =============================================================
;  EXTRA METERS  (hidden panel)
; =============================================================

[extrabottomline]
MeterStyle=DefaultGridLine
X=3
Y=(#initialY#+11*#horizgapY#)
W=#longlingraphwidth#
Group=hidden

[extraverticalline]
Meter=Image
X=(2+#longlingraphwidth#)
Y=#initialY#
H=(#initialY#+9*#horizgapY#)
W=1
SolidColor=#GRIDCOLOR#
AntiAlias=1
UpdateDivider=-1
Group=hidden

[header1]
Meter=String
MeterStyle=DefaultText
X=#extraheaderxpos#
Y=107
Text="No data"
UpdateDivider=-1
Group=hidden

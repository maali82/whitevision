[Metadata]
Author=Ragingwasabi
Information=A skin that displays info about your RAM

[Rainmeter]
Update=500
@include=#@#BVsettings.inc
OnRefreshAction=[!HideMeterGroup "hidden"][!Redraw]

[Variables]
@include=#@#BVstylesheet.inc

; Peak tracking — do not change
peakhold=0


; =============================================================
;  MEASURES
; =============================================================

[MeasureTotalRAM]
Measure=PhysicalMemory
Total=1
UpdateDivider=2

[MeasureUsedRAM]
Measure=PhysicalMemory
UpdateDivider=2

[MeasureFreeRAM]
Measure=PhysicalMemory
InvertMeasure=1
UpdateDivider=2

[peakused]
Measure=Calc
Formula=MeasureUsedRAM
IfConditionMode=1
IfCondition=peakused > #peakhold#
IfTrueAction=[!SetVariable peakhold ([peakused])]
DynamicVariables=1
UpdateDivider=2

[finalcalc]
Measure=Calc
Formula=#peakhold#
DynamicVariables=1
MinValue=0
MaxValue=[MeasureTotalRAM]
UpdateDivider=2


; =============================================================
;  GRAPH BACKGROUND GRID
; =============================================================

[TOPBORDERLine1]
MeterStyle=DefaultGridLine
X=#initialX#
Y=#initialY#

[Line2]
MeterStyle=DefaultGridLine
X=#initialX#
Y=(#initialY#+1*#horizgapY#)

[Line3]
MeterStyle=DefaultGridLine
X=#initialX#
Y=(#initialY#+2*#horizgapY#)

[Line4]
MeterStyle=DefaultGridLine
X=#initialX#
Y=(#initialY#+3*#horizgapY#)

[Line5]
MeterStyle=DefaultGridLine
X=#initialX#
Y=(#initialY#+4*#horizgapY#)

[Line6]
MeterStyle=DefaultGridLine
X=#initialX#
Y=(#initialY#+5*#horizgapY#)

[Line7]
MeterStyle=DefaultGridLine
X=#initialX#
Y=(#initialY#+6*#horizgapY#)

[Line8]
MeterStyle=DefaultGridLine
X=#initialX#
Y=(#initialY#+7*#horizgapY#)

[Line9]
MeterStyle=DefaultGridLine
X=#initialX#
Y=(#initialY#+8*#horizgapY#)

[Line10]
MeterStyle=DefaultGridLine
X=#initialX#
Y=(#initialY#+9*#horizgapY#)

[Line11]
MeterStyle=DefaultGridLine
X=#initialX#
Y=(#initialY#+10*#horizgapY#)


; =============================================================
;  GRAPH
; =============================================================

[RAMGraph]
Meter=Histogram
MeasureName=MeasureUsedRAM
X=3
Y=21
H=#lingraphheight#
W=#lingraphwidth#
PrimaryColor=#lingraphcolor#
SecondaryColor=#lingraphcolor#
LineCount=1
LineColor=#lingraphcolor#
AntiAlias=1
Autoscale=0


; =============================================================
;  BACKGROUND  (hover to reveal extra panel)
; =============================================================

[background]
Meter=Image
X=0
Y=0
W=605
H=125
SolidColor=0,0,0,1
MouseOverAction=[!EnableMeasureGroup "hidden"][!UpdateMeasureGroup "hidden"][!UpdateMeterGroup "hidden"][!ShowMeterGroup "hidden"][!Redraw]
MouseLeaveAction=[!DisableMeasureGroup "hidden"][!HideMeterGroup "hidden"][!Redraw]
UpdateDivider=-1


; =============================================================
;  METERS
; =============================================================

[RAMHeader]
Meter=String
MeterStyle=DefaultText
X=3
Y=2
Text="RAM"
UpdateDivider=-1

[peakusedpercheader]
Meter=String
MeterStyle=DefaultText
X=#headerxpos#
Y=47
Text="Peak:"
UpdateDivider=-1

[peakusedpercmeter]
Meter=String
MeterStyle=DefaultText
MeasureName=finalcalc
X=#percentxpos#
Y=r
Percentual=1
PostFix="%"
NumOfDecimals=2
UpdateDivider=2

[TotalRAMheader]
Meter=String
MeterStyle=DefaultText
X=#headerxpos#
Y=20r
Text="Total:"
UpdateDivider=-1

[TotalRAMmeter]
Meter=String
MeterStyle=DefaultText
X=#percentxpos#
Y=r
Text="100.00%"
UpdateDivider=-1

[FreeRAMheader]
Meter=String
MeterStyle=DefaultText
X=#headerxpos#
Y=20r
Text="Free:"
UpdateDivider=-1

[FreeRAMmeter]
Meter=String
MeterStyle=DefaultText
MeasureName=MeasureFreeRAM
X=#percentxpos#
Y=r
Percentual=1
PostFix="%"
NumOfDecimals=2
UpdateDivider=2

[UsedRAMheader]
Meter=String
MeterStyle=DefaultText
X=#headerxpos#
Y=20r
Text="Used:"
UpdateDivider=-1

[UsedRAMmeter]
Meter=String
MeterStyle=DefaultText
MeasureName=MeasureUsedRAM
X=#percentxpos#
Y=r
Percentual=1
PostFix="%"
NumOfDecimals=2
UpdateDivider=2


; =============================================================
;  ABSOLUTE VALUE STRINGS
; =============================================================

[peakusedGB]
Meter=String
MeterStyle=DefaultText
MeasureName=finalcalc
X=#absvaluexpos#
Y=47
AutoScale=1
NumOfDecimals=2
PostFix="B"
UpdateDivider=2

[TotalRAMString]
Meter=String
MeterStyle=DefaultText
MeasureName=MeasureTotalRAM
X=#absvaluexpos#
Y=20r
AutoScale=1
NumOfDecimals=2
PostFix="B"
UpdateDivider=2

[FreeRAMString]
Meter=String
MeterStyle=DefaultText
MeasureName=MeasureFreeRAM
X=#absvaluexpos#
Y=20r
AutoScale=1
NumOfDecimals=2
PostFix="B"
UpdateDivider=2

[UsedRAMString]
Meter=String
MeterStyle=DefaultText
MeasureName=MeasureUsedRAM
X=#absvaluexpos#
Y=20r
AutoScale=1
NumOfDecimals=2
PostFix="B"

[Metadata]
Author=Ragingwasabi / modified
Information=Dedicated GPU memory usage monitor using Windows GPU Process Memory counters

[Rainmeter]
Update=500
@include=#@#BVsettings.inc
OnRefreshAction=[!HideMeterGroup "hidden"][!Redraw]

[Variables]
@include=#@#BVstylesheet.inc
; Dedicated VRAM capacity configured for this system: 4 GiB.
; UsageMonitor Alias=VRAM reports per-process usage, not adapter capacity.
vramtotal=4294967296
VRAMPEAK=0

; =============================================================
;  MEASURES
; =============================================================

[MeasureTotalVRAM]
Measure=Calc
Formula=#vramtotal#
MinValue=0
MaxValue=#vramtotal#
UpdateDivider=-1

[MeasureUsedVRAM]
Measure=Plugin
Plugin=UsageMonitor
Alias=VRAM
Index=0
MinValue=0
MaxValue=#vramtotal#
UpdateDivider=2

[MeasureFreeVRAM]
Measure=Calc
Formula=MAX(0,#vramtotal#-MeasureUsedVRAM)
MinValue=0
MaxValue=#vramtotal#
UpdateDivider=2

[peakused]
Measure=Calc
Formula=MeasureUsedVRAM
IfConditionMode=1
IfCondition=peakused > #VRAMPEAK#
IfTrueAction=[!SetVariable VRAMPEAK [peakused]]
DynamicVariables=1
UpdateDivider=2

[finalcalc]
Measure=Calc
Formula=#VRAMPEAK#
MinValue=0
MaxValue=#vramtotal#
DynamicVariables=1
UpdateDivider=2

; =============================================================
;  GRAPH BACKGROUND GRID

[Metadata]
Author=Ragingwasabi / modified
Information=GPU utilization monitor using the Windows GPU Engine performance counters

[Rainmeter]
Update=500
@include=#@#BVsettings.inc
OnRefreshAction=[!HideMeterGroup "hidden"][!Redraw]

[Variables]
@include=#@#BVstylesheet.inc
GPUPEAK=0

; =============================================================
;  MEASURES
; =============================================================

; UsageMonitor refreshes its performance counters once per second.
; Index=0 totals the GPU Engine instances. The displayed value is
; capped at 100% because multiple engine types can sum above 100.
[MeasureGPUraw]
Measure=Plugin
Plugin=UsageMonitor
Alias=GPU
Index=0
MinValue=0
UpdateDivider=2

[MeasureGPU]
Measure=Calc
Formula=MIN(MeasureGPUraw,100)
MinValue=0
MaxValue=100
UpdateDivider=2

[avgMeasureGPU]
Measure=Calc
Formula=MeasureGPU
AverageSize=20
UpdateDivider=2

[peakMeasureGPU]
Measure=Calc
Formula=MeasureGPU
IfConditionMode=1
IfCondition=peakMeasureGPU > #GPUPEAK#
IfTrueAction=[!SetVariable GPUPEAK [peakMeasureGPU]]
DynamicVariables=1
UpdateDivider=2

[peakGPU]
Measure=Calc
Formula=#GPUPEAK#
DynamicVariables=1
UpdateDivider=2


[Metadata]
Author=Ragingwasabi
Information=A skin that displays info about your swap memory

[Rainmeter]
Update=500
@include=#@#BVsettings.inc
OnRefreshAction=[!HideMeterGroup "hidden"][!Redraw]

[Variables]
@include=#@#BVstylesheet.inc

; Peak tracking — do not change
peakhold=0


; =============================================================
;  MEASURES
; =============================================================

[MeasureTotalSWAP]
Measure=SwapMemory
Total=1
UpdateDivider=2

[MeasureUsedSWAP]
Measure=SwapMemory
UpdateDivider=2

[MeasureFreeSWAP]
Measure=SwapMemory
InvertMeasure=1
UpdateDivider=2

[peakused]
Measure=Calc
Formula=MeasureUsedSWAP
IfConditionMode=1
IfCondition=peakused > #peakhold#
IfTrueAction=[!SetVariable peakhold ([peakused])]
DynamicVariables=1
UpdateDivider=2

[finalcalc]
Measure=Calc
Formula=#peakhold#
DynamicVariables=1
MinValue=0
MaxValue=[MeasureTotalSWAP]
UpdateDivider=2


; =============================================================
;  GRAPH BACKGROUND GRID
; =============================================================

[TOPBORDERLine1]
MeterStyle=DefaultGridLine
X=#initialX#
Y=#initialY#

[Line2]
MeterStyle=DefaultGridLine
X=#initialX#
Y=(#initialY#+1*#horizgapY#)

[Line3]

W=#lingraphwidth#
PrimaryColor=#graphoutlinecolor#
SecondaryColor=#graphoutlinecolor#
LineCount=1
LineColor=#graphoutlinecolor#
AntiAlias=1
Autoscale=0
X=2
Y=21

[SWAPGraphOutlineR]

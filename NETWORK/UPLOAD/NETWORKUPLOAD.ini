[Metadata]
Author=g3xter  Modder=Ragingwasabi
Information=Displays information on current upstream data flow

[Rainmeter]
Update=500
@include=#@#BVsettings.inc

[Variables]
@include=#@#BVstylesheet.inc

; Peak tracking — do not change
MaxBytesPerSec=0


; =============================================================
;  MEASURES
; =============================================================

[Net]
Measure=NetOut
Interface=Best
UpdateDivider=2

[Netavg]
Measure=Calc
Formula=Net
AverageSize=30
UpdateDivider=2

[NetCount]
Measure=NetOut
Cumulative=1
Interface=Best
UpdateDivider=2

[MeasureTimeNow]
Measure=Time

[MeasureTimeReset]
Measure=Time
Format=%d/%m/%Y
TimeStamp=13423083902

[MeasureMaxBytesPerSec]
Measure=Calc
Formula=Net
IfConditionMode=1
IfCondition=MeasureMaxBytesPerSec > #MaxBytesPerSec#
IfTrueAction=[!SetVariable MaxBytesPerSec ([MeasureMaxBytesPerSec])]
DynamicVariables=1

[finalcalc]
Measure=Calc
Formula=#MaxBytesPerSec#
DynamicVariables=1


; =============================================================
;  GRAPH BACKGROUND GRID
; =============================================================

[TOPBORDERLine1]
MeterStyle=DefaultGridLineLong
X=#initialX#
Y=#initialY#

[Line2]
MeterStyle=DefaultGridLineLong
X=#initialX#
Y=(#initialY#+1*#horizgapY#)

[Line3]
MeterStyle=DefaultGridLineLong
X=#initialX#
Y=(#initialY#+2*#horizgapY#)

[Line4]
MeterStyle=DefaultGridLineLong
X=#initialX#
Y=(#initialY#+3*#horizgapY#)

[Line5]
MeterStyle=DefaultGridLineLong
X=#initialX#
Y=(#initialY#+4*#horizgapY#)

[Line6]
MeterStyle=DefaultGridLineLong
X=#initialX#
Y=(#initialY#+5*#horizgapY#)

[Line7]
MeterStyle=DefaultGridLineLong
X=#initialX#
Y=(#initialY#+6*#horizgapY#)

[Line8]
MeterStyle=DefaultGridLineLong
X=#initialX#
Y=(#initialY#+7*#horizgapY#)

[Line9]
MeterStyle=DefaultGridLineLong
X=#initialX#
Y=(#initialY#+8*#horizgapY#)

[Line10]
MeterStyle=DefaultGridLineLong
X=#initialX#
Y=(#initialY#+9*#horizgapY#)

[Line11]
MeterStyle=DefaultGridLineLong
X=#initialX#
Y=(#initialY#+10*#horizgapY#)


; =============================================================
;  GRAPH
; =============================================================

[NetworkTrafficGraphLine]
Meter=Histogram
MeasureName=Net
X=3
Y=20
H=#lingraphheight#
W=#longlingraphwidth#
PrimaryColor=#lingraphcolor#
SecondaryColor=#lingraphcolor#
LineCount=1
LineColor=#lingraphcolor#
AutoScale=1
AntiAlias=1


; =============================================================
;  METERS
; =============================================================

[NetworkTrafficGraphHeader]
Meter=String
MeterStyle=DefaultText
X=3
Y=2
Text="NETWORK (UP)"
UpdateDivider=-1

[Refreshheader]
Meter=String
MeterStyle=DefaultText
X=620
Y=27
Text="Last Reset:"
UpdateDivider=-1

[NetworkTrafficHeader]
Meter=String
MeterStyle=DefaultText
X=620
Y=20r
Text="Total Up:"
UpdateDivider=-1

[PeakHeader]
Meter=String
MeterStyle=DefaultText
X=620
Y=20r
Text="Peak Up:"
UpdateDivider=-1

[avgTrafficHeader]
Meter=String
MeterStyle=DefaultText
X=620
Y=20r
Text="Average Up:"
UpdateDivider=-1

[CurrentTrafficHeader]
Meter=String
MeterStyle=DefaultText
X=620
Y=20r
Text="Current Up:"
UpdateDivider=-1


; =============================================================
;  VALUE STRINGS + RESET BUTTON
; =============================================================

[RefreshButton]
Meter=Button
X=845
Y=26
ButtonImage=#@#REFRESH BUTTON.png
ButtonCommand=[!ResetStats][!WriteKeyValue MeasureTimeReset TimeStamp "[MeasureTimeNow:]"][!SetOption MeasureTimeReset TimeStamp "[MeasureTimeNow:]"][!WriteKeyValue MeasureTimeReset TimeStamp "[MeasureTimeNow:]" "#SKINSPATH#BlueVision_V0.2_Mod\NETWORK\DOWNLOAD\NETWORKDOWNLOAD.ini"][!SetOption MeasureTimeReset TimeStamp "[MeasureTimeNow:]" "BlueVision_V0.2_Mod\NETWORK\DOWNLOAD"][!Refresh "BlueVision_V0.2_Mod\NETWORK\DOWNLOAD"][!Refresh]
ToolTipType=0
ToolTipText="Reset Network Statistics"
SolidColor=0,0,0,1
UpdateDivider=-1

[MeterTimeReset]
Meter=String
MeterStyle=DefaultText
MeasureName=MeasureTimeReset
X=755
Y=27
UpdateDivider=1

[NetworkTrafficCounter]
Meter=String
MeterStyle=DefaultText
MeasureName=NetCount
X=755
Y=20r
AutoScale=1
NumOfDecimals=2
PostFix="B"
UpdateDivider=2

[PeakTraffic]
Meter=String
MeterStyle=DefaultText
MeasureName=finalcalc
X=755
Y=20r
Text="%1"
AutoScale=1
NumOfDecimals=2
PostFix="B/s"
DynamicVariables=1
UpdateDivider=2

[avgTraffic]
Meter=String
MeterStyle=DefaultText
MeasureName=Netavg
X=755
Y=20r
AutoScale=1
NumOfDecimals=2
PostFix="B/s"
UpdateDivider=2

[NetworkTraffic]
Meter=String
MeterStyle=DefaultText
MeasureName=Net
X=755
Y=20r
AutoScale=1
NumOfDecimals=2
PostFix="B/s"
UpdateDivider=2
